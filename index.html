<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noel Curtin | Frontend Developer</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        font-size: 100%;
      }

      body {
        font-family: "Source Code Pro", monospace;
        line-height: 1.6;
      }

      .hero {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }

        max-width: 775px;
      }

      .hero-content h1 {
        font-family: "Libre Baskerville", serif;
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      .hero-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
      }

      .button {
        background-color: #00356b;
        border: none;
        border-radius: 4px;
        color: #fff;
        padding: 0.625rem 1.5rem;

        text-decoration: none;
        display: inline-block;

    <header class="hero">

        <p>
          Frontend Developer specializing in JavaScript, HTML/CSS, and digital

        </p>
        <div class="hero-actions">
          <a
            href="assets/Noel Curtin - Resume.pdf"
