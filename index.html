<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noel Curtin | Frontend Developer</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Dekko|Lato:900|Rock+Salt");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      header {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }

      .hero-content {
        max-width: 700px;
      }

      .hero-content h1 {
        margin-bottom: 0.5rem;
      }

      .hero-content p {
        line-height: 1.6;
      }

      /* .button {
        background-color: #04aa6d;
        border: none;
        border-radius: 90px;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        margin: 14px 2px;
        cursor: pointer;
      } */

      /* From Uiverse.io by adamgiebl */
      .button {
        color: black;
        text-decoration: none;
        background: #fbca1f;
        font-family: inherit;
        padding: 0.6em 1.3em;
        font-weight: 900;
        font-size: 18px;
        border: 3px solid black;
        border-radius: 0.4em;
        box-shadow: 0.1em 0.1em;
        cursor: pointer;
        display: inline-block;
        margin: 14px 2px;
      }

      .button:hover {
        transform: translate(-0.05em, -0.05em);
        box-shadow: 0.15em 0.15em;
      }

      .button:active {
        transform: translate(0.05em, 0.05em);
        box-shadow: 0.05em 0.05em;
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-content">
        <h1>Noel Curtin</h1>
        <p>Frontend Developer specializing in JavaScript, HTML/CSS, and digital automation.</p>

        <p>Building responsive interfaces and tools that improve workflows.</p>
        <a href="#resume" class="button">Resume</a>
        <a href="#projects" class="button">Projects</a>
      </div>
    </header>
  </body>
</html>
